stages:
  - check
  - containers

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/frontend

# Stage 1: Check (Test and Linter)
test_and_lint:
  stage: check
  image: node:22-alpine
  before_script:
    - corepack enable pnpm
    - pnpm install --frozen-lockfile
  script:
    - echo "Executing code review (Linter)..."
    - pnpm run lint
    

# Stage 2: Containerize (Build and Docker push)
build_and_publish_image:
  stage: containers
  image: docker:24.0.5-alpine
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    - docker build -t $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA -t $DOCKER_IMAGE_NAME:latest .

    - echo "Pushing image to Container Registry..."
    - docker push $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $DOCKER_IMAGE_NAME:latest
    