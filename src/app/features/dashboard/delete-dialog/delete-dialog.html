<button class="btn btn-sm btn-ghost btn-square hover:bg-error" (click)="openModal()">
  <svg lucideTrash [size]="16"></svg>
</button>

<dialog #modal class="modal">
  <div class="modal-box">
    <h3 class="text-lg font-bold">Delete project</h3>
    <p class="py-4">
      Are you sure you want to delete "{{ project.name }}"? This action cannot be undone.
    </p>
    <div class="modal-action">
      <button type="button" class="btn btn-ghost" (click)="closeModal()">Cancel</button>
      <button type="button" class="btn btn-error text-white" (click)="onConfirm()">Confirm</button>
    </div>
  </div>
</dialog>
